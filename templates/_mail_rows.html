{% for m in mail_rows %}
{% set mb = box_lookup[m.mailbox_id] %}
{% set st = mail_state[m.id] %}
<div class="ema-mail-message-row {{ 'is-read' if st['read'] else 'is-unread' }} {{ 'is-starred' if st['starred'] else '' }}" data-mail-id="{{ m.id }}">
  <input type="checkbox" class="ema-mail-select" name="mail_ids" value="{{ m.id }}" form="ema-mail-bulk-form" aria-label="Vybrat zprávu {{ m.subject or '(bez předmětu)' }}">
  <form method="post" action="{{ url_for('set_mail_state', mail_id=m.id) }}" class="ema-star-form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <input type="hidden" name="action" value="{{ 'unstar' if st['starred'] else 'star' }}">
    <input type="hidden" name="box" value="{{ selected_box.id if selected_box else '' }}">
    <input type="hidden" name="folder" value="{{ selected_folder.id if selected_folder else '' }}">
    <button class="ema-mail-star" type="submit" aria-label="{{ 'Odebrat hvězdičku' if st['starred'] else 'Označit hvězdičkou' }}" title="Příznak v Emě">{{ '★' if st['starred'] else '☆' }}</button>
  </form>
  <a class="ema-mail-item ema-mail-quick-link" data-preview-url="{{ url_for('mail_quick_preview', mail_id=m.id) }}" href="{{ url_for('mail_detail', org_id=mb.organization_id, message_id=m.id, folder=m.folder_id) }}" aria-expanded="false">
    <span class="ema-mail-from">{{ m.sender }}</span>
    <strong class="ema-mail-subject">{{ m.subject or '(bez předmětu)' }}</strong>
    <small class="ema-mail-origin">{{ mb.label }}</small>
    <time class="ema-mail-time">{{ m.sent_at.strftime('%d.%m. %H:%M') if m.sent_at else '—' }}</time>
  </a>
  <div class="ema-message-actions">
    {% if m.mailbox_id in can_move_ids %}
    <form method="post" action="{{ url_for('mail_quick_move', mail_id=m.id) }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <input type="hidden" name="action" value="archive">
      <button class="ema-mail-icon" type="submit" title="Archivovat na serveru">▣</button>
    </form>
    <form method="post" action="{{ url_for('mail_quick_move', mail_id=m.id) }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <input type="hidden" name="action" value="trash">
      <button class="ema-mail-icon ema-mail-trash" type="submit" title="Přesunout do Koše">🗑</button>
    </form>
    {% endif %}
  </div>
  <div class="ema-mail-inline-slot" data-preview-slot="{{ m.id }}" hidden></div>
</div>
{% endfor %}
