name: EMA V0.1 tests
on:
  push:
    paths:
      - "ema/**"
      - "tests/**"
      - "templates/**"
      - "requirements*.txt"
      - ".github/workflows/v01-tests.yml"
  pull_request:
    paths:
      - "ema/**"
      - "tests/**"
      - "templates/**"
      - "requirements*.txt"
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m compileall -q ema
      - run: python -m pytest -q