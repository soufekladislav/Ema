name: EMA original portrait assets

on:
  push:
    branches: [main]
    paths:
      - scripts/update_ema_icons.py
      - .github/workflows/ema-portrait-assets.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-ema-icons:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check 'Pillow>=10,<12'
      - name: Crop original published Ema portrait (no image generation)
        run: python scripts/update_ema_icons.py
      - name: Commit actual JPG and correctly sized PWA/chat images
        run: |
          git add static/icons/ema-source.jpg static/icons/ema-192.png static/icons/ema-512.png static/icons/ema-avatar.png
          if git diff --cached --quiet; then
            echo "Icons already match the original image."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "assets: use original Ema portrait in PWA icon and chat avatar"
          git push origin HEAD:main
